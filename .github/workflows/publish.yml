name: Publish Package

on:
   push:
      branches: [main]
      paths:
         - "package.json"
   workflow_dispatch:

jobs:
   publish:
      runs-on: ubuntu-latest
      permissions:
         id-token: write
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"

         - name: Pin npm 12
           run: npm install -g npm@12

         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project

         - name: Check if version is already published
           id: check
           run: |
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              PACKAGE_VERSION=$(node -p "require('./package.json').version")
              PUBLISHED=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || echo "")
              if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi

         - name: Install dependencies
           if: steps.check.outputs.skip == 'false'
           run: npm ci

         - name: Type check and lint
           if: steps.check.outputs.skip == 'false'
           run: npm run check

         - name: Run unit tests
           if: steps.check.outputs.skip == 'false'
           run: npm run unit

         - name: Run integration tests
           if: steps.check.outputs.skip == 'false'
           run: npm run integration

         - name: Build
           if: steps.check.outputs.skip == 'false'
           run: npm run build

         - name: Publish to NPM
           if: steps.check.outputs.skip == 'false'
           run: npm publish --access public
